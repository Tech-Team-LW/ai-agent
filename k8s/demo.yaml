apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: ai-sre-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: ai-sre-lab
spec:
  selector:
    app: demo-web
  ports:
    - port: 80
      targetPort: 80
